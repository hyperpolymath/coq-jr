# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# RSR-compliant CodeQL workflow with SHA-pinned actions

name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '42 20 * * 0'


permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (manual mode)
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          # Manual build commands - uncomment the appropriate line for your language
          # Rust: cargo build --release
          # Elixir: mix compile
          # Go: go build ./...
          # Java: ./gradlew build || mvn compile
          echo "Configure your build command above for manual build mode languages"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
